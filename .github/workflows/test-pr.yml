name: Test Pull Request

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.nix'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check formatting and workflow syntax
        run: |
          nix develop -c nixfmt --check flake.nix package.nix
          nix develop -c actionlint

      - name: Run flake checks and build
        run: |
          nix flake check --print-build-logs
          nix build .#antigravity-cli --print-build-logs

      - name: Verify CLI binary
        run: |
          test -x ./result/bin/agy
          expected_version=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)";/\1/p' package.nix | head -1)
          actual_version=$(./result/bin/agy --version)
          echo "Installed version: $actual_version"
          test "$actual_version" = "$expected_version"
          ./result/bin/agy --help >/dev/null
